name: Gold signals

on:
  schedule:
    - cron: "*/5 * * * 1-5"      # every 5 minutes, Mon-Fri (GitHub's minimum interval)
  workflow_dispatch:              # lets you run it manually from the Actions tab

permissions:
  contents: write                 # needed to commit trades.csv

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_signals.py --telegram

      - name: Save paper-trading log
        run: |
          if [ -f trades.csv ]; then
            git config user.name "gold-bot"
            git config user.email "gold-bot@users.noreply.github.com"
            git add trades.csv
            git diff --cached --quiet || (git commit -m "update trades" && git pull --rebase && git push)
          fi
